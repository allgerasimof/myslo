<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Платиновая сотня — согласование баннеров</title><style>
*{box-sizing:border-box}body{margin:0;background:#eceef2;color:#20242a;font:15px/1.45 Arial,sans-serif}.top{background:#1b1d1f;color:white;padding:32px max(24px,calc((100vw - 1320px)/2))}.top h1{font-size:32px;margin:0 0 6px}.top p{color:#aeb3bb;margin:0}.main{max-width:1368px;padding:28px 24px 64px;margin:auto}.intro{margin-bottom:25px;color:#515965}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px}.card{background:white;border-radius:16px;padding:18px;box-shadow:0 3px 22px #1c26300c;min-width:0}.card.wide{grid-column:1/-1}.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.meta strong{font-size:17px}.meta span{font-size:12px;color:#707782}.viewport{position:relative;width:100%;height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:repeating-conic-gradient(#f1f2f4 0% 25%,#e6e8eb 0% 50%) 50%/18px 18px;border-radius:8px}.card.wide .viewport{height:520px}.stage{position:absolute;left:50%;top:50%;transform-origin:center center;background:#1b1d1f;box-shadow:0 5px 25px #0002;overflow:hidden}.stage iframe{display:block;border:0;width:100%;height:100%}.hint{margin-top:10px;font-size:12px;color:#777f89}.footer{margin-top:26px;color:#69717b;font-size:13px}@media(max-width:650px){.top{padding:25px 20px}.top h1{font-size:25px}.main{padding:20px 12px}.grid{grid-template-columns:1fr}.viewport{height:470px}.card.wide .viewport{height:330px}}
</style></head><body><header class="top"><h1>Платиновая сотня</h1><p>Адаптивный HTML5-баннер · варианты размещения · версия 14 · исправленная</p></header><main class="main"><div class="intro">Все макеты ниже — один и тот же живой баннер в разных размерах. Анимация работает независимо в каждом окне. Для согласования дизайна.</div><div class="grid" id="grid"></div></main><script>
const variants=[['Узкий',198,529],['Стандартный',240,400],['Квадратный',400,400],['Горизонтальный',612,400]];
const grid=document.getElementById('grid');
variants.forEach(([label,w,h])=>{const card=document.createElement('section');card.className='card'+(w/h>1.2?' wide':'');card.innerHTML=`<div class="meta"><strong>${label}</strong><span>${w} × ${h} px</span></div><div class="viewport"><div class="stage" style="width:${w}px;height:${h}px"><iframe title="Баннер ${w} на ${h}" src="banner/index.html" scrolling="no" loading="eager"></iframe></div></div><div class="hint">Масштабировано для предпросмотра · исходные пропорции сохранены</div>`;grid.appendChild(card)});
function fit(){document.querySelectorAll('.viewport').forEach(view=>{const stage=view.querySelector('.stage'),w=parseFloat(stage.style.width),h=parseFloat(stage.style.height);const s=Math.min((view.clientWidth-20)/w,(view.clientHeight-20)/h,1);stage.style.transform=`translate(-50%,-50%) scale(${s})`})}window.addEventListener('resize',fit);new ResizeObserver(fit).observe(grid);fit();
</script></body></html>
