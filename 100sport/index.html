<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тульская спортивная сотня — согласование баннера</title><style>*{box-sizing:border-box}body{margin:0;color:#1d2432;background:#eef1f6;font:15px/1.5 Arial,sans-serif}header{background:#092b77;color:#fff;padding:28px max(22px,calc((100vw - 1240px)/2))}header h1{margin:0 0 6px;font-size:30px}header p{margin:0;color:#bad1fb}main{max-width:1290px;margin:auto;padding:24px 18px 55px}.actions{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px}.actions a{background:#e90a19;color:#fff;padding:12px 19px;border-radius:9px;text-decoration:none;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.card{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 20px #071f4910;min-width:0}.card.wide{grid-column:1/-1}.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:14px}.meta strong{font-size:17px}.meta span{color:#6b7485;font-size:12px}.viewport{position:relative;width:100%;height:540px;border-radius:8px;overflow:hidden;background:repeating-conic-gradient(#f4f6fa 0 25%,#e7eaf0 0 50%) 50%/20px 20px}.stage{position:absolute;left:50%;top:50%;transform-origin:center;box-shadow:0 8px 23px #051c4f25}.stage iframe{display:block;width:100%;height:100%;border:0}.hint{font-size:12px;color:#87909c;margin-top:10px}@media(max-width:940px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:620px){.grid{grid-template-columns:1fr}.viewport{height:490px}.card.wide .viewport{height:330px}header h1{font-size:24px}}</style></head><body><header><h1>Тульская спортивная сотня</h1><p>Адаптивный HTML5-баннер · согласование макета</p></header><main><div class="actions"><span>Один живой креатив в четырёх рекламных форматах</span><a href="./adfox.zip" download>Скачать ZIP для Adfox</a></div><div class="grid" id="grid"></div></main><script>const sizes=[['Узкий',198,529],['Стандартный',240,400],['Квадратный',400,400],['Горизонтальный',612,400]];const grid=document.getElementById('grid');sizes.forEach(([name,w,h])=>{const c=document.createElement('section');c.className='card'+(w/h>1.2?' wide':'');c.innerHTML=`<div class="meta"><strong>${name}</strong><span>${w} × ${h} px</span></div><div class="viewport"><div class="stage" style="width:${w}px;height:${h}px"><iframe src="./banner/index.html" title="${name} ${w} на ${h}" scrolling="no"></iframe></div></div><div class="hint">Исходные размеры iframe сохранены</div>`;grid.append(c)});function fit(){document.querySelectorAll('.viewport').forEach(v=>{const s=v.querySelector('.stage'),w=parseFloat(s.style.width),h=parseFloat(s.style.height),k=Math.min((v.clientWidth-22)/w,(v.clientHeight-22)/h,1);s.style.transform=`translate(-50%,-50%) scale(${k})`})}window.addEventListener('resize',fit);new ResizeObserver(fit).observe(grid);fit();</script></body></html>
