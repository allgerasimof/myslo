<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тульская спортивная сотня — согласование</title><style>*{box-sizing:border-box}body{font:15px Arial,sans-serif;background:#edf0f5;margin:0;color:#152744}header{background:#092e77;color:white;padding:30px max(20px,calc((100vw - 1280px)/2))}h1{margin:0 0 8px;font-size:29px}main{max-width:1300px;margin:24px auto;padding:0 20px}.intro{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:22px}.download{background:#ed061b;color:white;text-decoration:none;padding:14px 20px;border-radius:10px;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:white;border-radius:15px;padding:16px;min-width:0}.wide{grid-column:1/-1}.meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:15px}.meta span{color:#6e7d95}.view{position:relative;height:545px;background:repeating-conic-gradient(#e7eaf0 0% 25%,#f4f6f9 0% 50%) 50%/18px 18px;overflow:hidden}.stage{position:absolute;top:50%;left:50%;transform-origin:center center;box-shadow:0 5px 24px #0002}iframe{width:100%;height:100%;border:0;display:block}.note{font-size:12px;color:#7a8598;margin-top:8px}@media(max-width:740px){.grid{grid-template-columns:1fr}.intro{flex-direction:column;align-items:flex-start}.wide .view{height:360px}}</style><header><h1>Тульская спортивная сотня</h1>Адаптивный HTML5-баннер · согласование макета</header><main><div class="intro"><span>Один HTML5-креатив в четырёх рекламных форматах</span><a class="download" href="./adfox.zip" download>Скачать ZIP для Adfox</a></div><div class="grid" id="grid"></div></main><script>const sizes=[['Узкий',198,529],['Стандартный',240,400],['Квадратный',400,400],['Горизонтальный',612,400]];let grid=document.getElementById('grid');sizes.forEach(([name,w,h])=>{let e=document.createElement('section');e.className='card'+(w>h?' wide':'');e.innerHTML='<div class="meta"><strong>'+name+'</strong><span>'+w+' × '+h+' px</span></div><div class="view"><div class="stage" style="width:'+w+'px;height:'+h+'px"><iframe src="banner/index.html" title="'+name+'"></iframe></div></div><div class="note">Реальные размеры iframe, масштабирование только для просмотра</div>';grid.append(e)});function fit(){document.querySelectorAll('.view').forEach(v=>{let s=v.firstElementChild,w=parseFloat(s.style.width),h=parseFloat(s.style.height),k=Math.min((v.clientWidth-18)/w,(v.clientHeight-18)/h,1);s.style.transform='translate(-50%,-50%) scale('+k+')'})}addEventListener('resize',fit);fit()</script>
