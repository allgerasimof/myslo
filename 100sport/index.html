<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тульская спортивная сотня — согласование</title><style>*{box-sizing:border-box}body{font:15px Arial;background:#eef1f6;color:#17233a;margin:0}header{background:#06317e;color:#fff;padding:30px 5%}h1{margin:0 0 10px}main{max-width:1250px;margin:25px auto;padding:0 18px}.download{display:inline-block;padding:13px 20px;background:#e91020;color:white;text-decoration:none;border-radius:8px;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.card{background:white;padding:15px;border-radius:14px;min-width:0}.card.wide{grid-column:1/-1}.view{height:540px;position:relative;overflow:hidden;background:#e3e8f0}.stage{position:absolute;left:50%;top:50%;transform-origin:center;box-shadow:0 5px 20px #0002}iframe{width:100%;height:100%;border:0}small{color:#758099}@media(max-width:700px){.grid{grid-template-columns:1fr}.card.wide .view{height:350px}}</style><header><h1>Тульская спортивная сотня</h1>Адаптивный HTML5-баннер · согласование</header><main><a class="download" href="adfox.zip" download>Скачать ZIP для Adfox</a><div class="grid" id="grid"></div></main><script>let grid=document.getElementById('grid');[['Узкий',198,529],['Стандартный',240,400],['Квадратный',400,400],['Горизонтальный',612,400]].forEach(([n,w,h])=>{let el=document.createElement('section');el.className='card'+(w>h?' wide':'');el.innerHTML='<h3>'+n+' · '+w+'×'+h+'</h3><div class="view"><div class="stage" style="width:'+w+'px;height:'+h+'px"><iframe src="banner/index.html" title="'+n+'"></iframe></div></div><small>Реальный размер iframe: '+w+'×'+h+' px</small>';grid.append(el)});function resize(){document.querySelectorAll('.view').forEach(v=>{let a=v.firstElementChild,w=parseFloat(a.style.width),h=parseFloat(a.style.height),s=Math.min((v.clientWidth-18)/w,(v.clientHeight-18)/h,1);a.style.transform='translate(-50%,-50%) scale('+s+')'})}addEventListener('resize',resize);resize()</script>
