<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тульская спортивная сотня</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif}.ad{display:block;width:100%;height:100%;position:relative;overflow:hidden;container-type:size;text-decoration:none;color:white;background:#06318b;isolation:isolate}.sports{position:absolute;inset:0;background:url('assets/sports.webp') center center/cover no-repeat;z-index:-2}.ad:after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(90deg,#002777 0%,#07358c 33%,#04348c44 72%,transparent 100%)}.layout{height:100%;width:100%;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;padding:clamp(10px,2.8cqw,38px);gap:10px}.logo{display:block;width:min(52%,680px);height:auto;max-height:28%;object-fit:contain;object-position:left top}.copy{margin-top:auto;width:min(76%,980px);min-width:0}.headline{font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:clamp(27px,8.3cqw,125px);font-style:italic;font-weight:900;line-height:1.03;letter-spacing:-.015em;white-space:nowrap;text-shadow:0 1px 3px #001b5555}.ribbon{margin-top:clamp(5px,1.3cqh,14px);background:#eb0919;display:table;max-width:100%;transform:skew(-8deg);padding:clamp(7px,1.3cqh,18px) clamp(11px,1.4cqw,22px)}.ribbon span{display:block;transform:skew(3deg);font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:clamp(23px,6.5cqw,96px);font-weight:900;font-style:italic;white-space:nowrap;line-height:1.04}.cta{background:#fff;color:#08337d;border-radius:99px;padding:clamp(10px,1.8cqh,20px) clamp(14px,2.5cqw,30px);font-weight:900;font-size:clamp(12px,2.5cqw,31px);white-space:nowrap;display:inline-flex;gap:18px;align-items:center;max-width:100%}.arrow{font-size:1.4em;font-weight:400;line-height:.7}@container(max-aspect-ratio:4/5){.sports{inset:13% -15% 0 -32%;background-position:52% center}.ad:after{background:linear-gradient(180deg,#052f87 0%,#053c9299 19%,transparent 42%,#002d7f66 68%,#002574 100%)}.layout{padding:clamp(9px,5cqw,22px);gap:7px}.logo{width:100%;max-height:21%;object-fit:contain}.copy{width:100%;margin-top:auto}.headline{font-size:clamp(28px,15.7cqw,65px)}.ribbon{padding:7px 9px;margin-top:7px}.ribbon span{font-size:clamp(19px,10.2cqw,45px)}.cta{font-size:clamp(10px,5cqw,20px);gap:9px;padding:10px 12px}}@container(min-aspect-ratio:4/5) and (max-aspect-ratio:5/4){.sports{inset:4% -4% 0 0;background-position:center}.ad:after{background:linear-gradient(180deg,#00287e 0%,#063b8e77 24%,transparent 50%,#002b7ec9 100%)}.logo{width:72%;max-height:24%}.copy{width:100%}.headline{font-size:clamp(35px,11.2cqw,65px)}.ribbon span{font-size:clamp(24px,7.9cqw,51px)}.cta{font-size:clamp(12px,3.5cqw,22px)}}@container(min-aspect-ratio:5/4) and (max-aspect-ratio:2/1){.sports{inset:0 0 0 38%;background-position:center}.copy{width:68%}.logo{width:58%;max-height:30%}.headline{font-size:clamp(36px,7.4cqw,94px)}.ribbon span{font-size:clamp(26px,5.7cqw,75px)}}@container(min-aspect-ratio:2/1){.sports{inset:0 0 0 52%}.layout{display:grid;grid-template-columns:28% 1fr;grid-template-rows:1fr;align-items:center;gap:3%;padding:clamp(7px,2cqh,18px)}.logo{width:100%;max-height:80%}.copy{width:100%;margin:0}.headline{font-size:clamp(20px,12cqh,60px)}.ribbon{padding:4px 12px;margin-top:4px}.ribbon span{font-size:clamp(17px,9.5cqh,48px)}.cta{position:absolute;left:31%;bottom:7%;font-size:clamp(10px,5cqh,20px);padding:5px 14px}.copy{padding-bottom:12%}}
