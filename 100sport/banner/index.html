<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Тульская спортивная сотня</title><style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif}.ad{position:relative;display:block;width:100%;height:100%;overflow:hidden;container-type:size;background:#05318b;color:white;text-decoration:none;isolation:isolate}.bg{position:absolute;inset:0;background-image:url('assets/sports-bg.webp');background-repeat:no-repeat;background-size:cover;background-position:71% 48%}.bg:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,35,110,.93),transparent 49%),linear-gradient(90deg,rgba(0,32,105,.18),transparent 65%)}.content{position:absolute;inset:0;padding:clamp(10px,3cqw,34px);display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:10px}.logo{display:block;width:clamp(148px,45cqw,480px);max-width:100%;height:auto;object-fit:contain;object-position:left top;filter:drop-shadow(0 1px 1px #00205b40)}.copy{margin-top:auto;display:flex;flex-direction:column;align-items:flex-start;gap:clamp(7px,1.7cqh,15px);max-width:100%;min-width:0}.headline{font-family:'Arial Narrow','Roboto Condensed',Arial,sans-serif;font-stretch:condensed;font-weight:900;font-style:italic;letter-spacing:-.045em;line-height:1;white-space:nowrap;display:block;text-shadow:0 1px 2px #00236455}.headline.first{font-size:clamp(25px,7.8cqw,105px)}.ribbon{background:#f00720;transform:skew(-8deg);padding:.13em .24em .15em;margin-left:3px;max-width:calc(100% - 6px)}.ribbon .headline{transform:skew(8deg);font-size:clamp(20px,5.6cqw,78px);text-shadow:none}.cta{display:flex;align-items:center;justify-content:center;gap:.8em;border-radius:999px;background:white;color:#00347d;padding:clamp(9px,2cqh,18px) clamp(12px,2cqw,28px);font-weight:800;font-size:clamp(11px,2.3cqw,29px);white-space:nowrap;line-height:1.1}.arrow{font-size:1.35em;font-weight:400;line-height:.8}
@container (max-aspect-ratio:9/10){.content{padding:clamp(9px,4.5cqw,20px)}.logo{width:100%;max-width:100%}.bg{background-position:72% 48%}.copy{width:100%;gap:clamp(8px,1.6cqh,13px)}.headline.first{font-size:clamp(24px,12.5cqw,50px)}.ribbon .headline{font-size:clamp(19px,9.3cqw,40px)}.cta{font-size:clamp(11px,4.3cqw,18px);padding:10px 12px}}
@container (min-aspect-ratio:9/10) and (max-aspect-ratio:3/2){.logo{width:60%}.bg{background-position:72% 48%}.headline.first{font-size:clamp(30px,9.5cqw,66px)}.ribbon .headline{font-size:clamp(22px,7.3cqw,52px)}.cta{font-size:clamp(11px,3cqw,22px)}}
@container (min-aspect-ratio:3/2) and (max-aspect-ratio:2/1){.logo{width:47%}.bg{background-position:72% 48%}.headline.first{font-size:clamp(30px,7.1cqw,90px)}.ribbon .headline{font-size:clamp(23px,5.3cqw,65px)}}
@container (min-aspect-ratio:2/1){.content{display:grid;grid-template-columns:29% 1fr;align-items:center;column-gap:2%;padding:clamp(8px,3cqh,26px)}.logo{width:100%}.copy{margin:0;gap:clamp(4px,1.6cqh,12px)}.bg{background-position:73% 48%}.headline.first{font-size:clamp(20px,11cqh,58px)}.ribbon .headline{font-size:clamp(17px,8cqh,44px)}.cta{font-size:clamp(10px,4.3cqh,23px);padding:clamp(6px,2cqh,14px) clamp(10px,1.5cqw,22px)}}
</style></head><body><a class="ad" id="ad" href="https://myslo.ru/" target="_blank" rel="noopener" aria-label="Расскажи о своём герое — заполнить анкету"><div class="bg"></div><div class="content"><img class="logo" src="assets/logo.png" alt="Тульская спортивная сотня"><div class="copy"><div class="headline first" data-fit>РАССКАЖИ</div><div class="ribbon"><div class="headline" data-fit>О СВОЕМ ГЕРОЕ!</div></div><div class="cta" data-fit>ЗАПОЛНИТЬ АНКЕТУ <span class="arrow">⟶</span></div></div></div></a><script nonce="%banner.nonce%">(function(){var a=document.getElementById('ad'),u='%banner.reference_mrc_user1%',t='%banner.target%';if(u.indexOf('%banner.')!==0)a.href=u;if(t.indexOf('%banner.')!==0)a.target=t;function fit(){document.querySelectorAll('[data-fit]').forEach(function(el){el.style.fontSize='';var parent=el.closest('.ribbon')?el.closest('.ribbon'):el.parentElement;var max=parent.clientWidth-(el.closest('.ribbon')?12:0),size=parseFloat(getComputedStyle(el).fontSize);for(var i=0;i<25&&el.scrollWidth>max&&size>9;i++){size-=.6;el.style.fontSize=size+'px'}})}new ResizeObserver(fit).observe(a);document.fonts&&document.fonts.ready.then(fit);fit()})()</script></body></html>
