<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Смешарики — большое шоу</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font-family:Arial,Helvetica,sans-serif}#ad{position:absolute;inset:0;overflow:hidden;container-type:size;color:white;text-decoration:none;-webkit-tap-highlight-color:transparent}.veil{position:absolute;inset:0;background:rgba(255,255,255,.4);opacity:0;transition:opacity .16s}.started .veil{opacity:1}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.poster{position:absolute;inset:0;background:linear-gradient(90deg,#24dae8,#0faed8 25%,#0486d1 50%,#0057b6 75%,#013396);opacity:0;visibility:hidden;transition:opacity .2s}.finished .poster{opacity:1;visibility:visible}.finished canvas,.finished .veil{visibility:hidden}.artboard{position:absolute;left:50%;bottom:0;width:min(100cqw,calc((100cqh - 64px)*2/3));aspect-ratio:2/3;transform:translateX(-50%);container-type:size}.artboard>img{position:absolute;width:100%;height:100%;inset:0;object-fit:contain}.copy{position:absolute;top:3%;left:5%;right:5%;text-align:center;text-shadow:0 3px 0 #003c8d,0 6px 22px #00347744}.eyebrow{font-size:2.9cqw;font-weight:800;letter-spacing:.16em;margin:0 0 2cqw}.title{margin:0;font-weight:900;font-size:11.5cqw;line-height:.92;letter-spacing:-.065em;color:#fff}.title em{display:block;font-size:13cqw;letter-spacing:-.065em;color:#ffe55a;font-style:normal;transform:rotate(-3deg);padding-top:1.5cqw}.subtitle{font-size:3.8cqw;line-height:1.15;font-weight:700;margin:3cqw 0 0}.details{display:inline-block;background:#fff;color:#0751a9;border-radius:100px;padding:2cqw 4cqw;font-size:2.9cqw;font-weight:800;margin-top:2cqw;text-shadow:none}.age{position:absolute;bottom:1.6%;right:4%;font-size:3cqw;font-weight:bold;background:#fff;color:#0751a9;border-radius:50%;width:7cqw;height:7cqw;display:grid;place-items:center}@media(prefers-reduced-motion:reduce){.poster{transition:none}}
</style></head><body>
<a id="ad" href="%banner.reference_mrc_user1%" target="%banner.target%" rel="noopener" aria-label="Смешарики. Большое шоу для всей семьи">
<div class="veil"></div><canvas id="animation" aria-hidden="true"></canvas>
<section class="poster" aria-label="Афиша шоу"><div class="artboard"><img src="assets/poster.jpg" alt="Крош, Ёжик, Нюша и Копатыч" fetchpriority="high"><div class="copy">
<!-- Все тексты афиши редактируются здесь, независимо от изображения. -->
<p class="eyebrow">ВСТРЕЧАЕМСЯ В МИРЕ ДЕТСТВА</p><h1 class="title">СМЕШАРИКИ<em>Большое шоу!</em></h1><p class="subtitle">Приключения начинаются<br>вместе с любимыми героями</p><p class="details">МУЗЫКА · ИГРЫ · ЧУДЕСА</p>
</div><span class="age">0+</span></div></section></a>
<script nonce="%request.eid1%">
(function(){'use strict';
var ad=document.getElementById('ad'),canvas=document.getElementById('animation'),ctx=canvas.getContext('2d'),sprite=new Image(),poster=document.querySelector('.artboard>img'),start=0,raf=0,w=0,h=0,reduced=matchMedia('(prefers-reduced-motion: reduce)'),duration=3650;
function resize(){w=ad.clientWidth;h=ad.clientHeight;var d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0)}
function lerp(a,b,t){return a+(b-a)*t}function clamp(t){return Math.max(0,Math.min(1,t))}function ease(t){return t*t*(3-2*t)}
// Motion in viewport units. Sprite changes only at the squash/look/jump poses.
function paint(ms){ctx.clearRect(0,0,w,h);var t=ms/1000,base=Math.min(w*.66,h*.38),x=w*.5,y=h*.57,scale=1,angle=0,frame=0;
if(t<.25)return;
if(t<.95){var p=clamp((t-.25)/.7);y=lerp(-base*.75,h*.57,p*p);angle=lerp(-.13,.06,p)}
else if(t<1.1){frame=1;scale=1+.08*Math.sin((t-.95)/.15*Math.PI)}
else if(t<1.55){var p=(t-1.1)/.45;y-=Math.sin(p*Math.PI)*h*.16;angle=-.09*Math.sin(p*Math.PI)}
else if(t<1.75){frame=1}
else if(t<2.12){frame=2;angle=-.045}
else if(t<2.5){frame=3;angle=.045}
else if(t<2.8){frame=4;y-=Math.sin((t-2.5)/.3*Math.PI)*h*.025}
else{frame=5;var p=clamp((t-2.8)/.77);scale=lerp(1,Math.max(w,h)/base*4.5,p*p*p);y=lerp(h*.57,h*.52,ease(p));angle=-.08*Math.sin(p*Math.PI)}
var cw=sprite.naturalWidth/3,ch=sprite.naturalHeight/2,size=base*scale;ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.drawImage(sprite,(frame%3)*cw,Math.floor(frame/3)*ch,cw,ch,-size/2,-size/2,size,size);ctx.restore();
}
function finish(){cancelAnimationFrame(raf);ad.classList.add('finished');document.documentElement.dataset.animation='finished'}
function tick(now){var elapsed=now-start;if(elapsed>=duration){finish();return}paint(elapsed);raf=requestAnimationFrame(tick)}
function run(){resize();ad.classList.add('started');if(!sprite.naturalWidth||reduced.matches){finish();return}start=performance.now();document.documentElement.dataset.animation='running';raf=requestAnimationFrame(tick)}
Promise.all([new Promise(function(resolve){sprite.onload=resolve;sprite.onerror=function(){finish();resolve()};sprite.src='assets/krosh.png'}),poster.decode().catch(function(){})]).then(run);
window.addEventListener('resize',resize);reduced.addEventListener('change',function(e){if(e.matches)finish()});
// No direct advertiser URL: navigation is supplied exclusively by Adfox.
ad.addEventListener('click',function(e){if(ad.getAttribute('href').indexOf('%')!==-1)e.preventDefault()});
})();
</script></body></html>
