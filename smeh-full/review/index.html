<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Смешарики · Fullscreen · Myslo</title><style>*{box-sizing:border-box}body{margin:0;background:#eff2f6;color:#17243a;font:15px/1.5 Arial,sans-serif}main{max-width:1000px;margin:auto;padding:42px 24px;display:flex;gap:56px;align-items:flex-start}header{flex:1;padding-top:30px}.tag{font-size:12px;letter-spacing:.12em;color:#57708c;font-weight:bold}h1{font-size:42px;line-height:1.05;letter-spacing:-.04em;margin:18px 0}p{color:#63748a}nav{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}a,button{font:700 14px Arial,sans-serif;padding:13px 18px;border-radius:12px;border:0;text-decoration:none;cursor:pointer}a{background:#075fe4;color:white}button{background:white;color:#12468a;box-shadow:0 0 0 1px #d2dce9}.phone{flex:none;width:390px}.label{font-size:12px;color:#63748a;margin-bottom:12px;display:flex;justify-content:space-between}.viewport{position:relative;width:390px;height:700px;overflow:hidden;border-radius:25px;box-shadow:0 20px 65px #18375b26;background:white}.site{position:absolute;inset:0;padding:32px 22px;background:#fff}.logo{font-weight:900;font-size:32px;color:#d8272e;border-bottom:1px solid #eee;padding-bottom:16px}.site h2{font-size:27px;line-height:1.15;margin-top:24px}.photo{height:180px;border-radius:12px;background:linear-gradient(140deg,#d7e7c9,#789ca0 50%,#c3d5e5)}.lines{height:180px;margin-top:24px;background:repeating-linear-gradient(#e5e9ee 0 9px,transparent 9px 24px)}.ad-layer{position:absolute;inset:0}.ad-layer[hidden]{display:none}.adfox-panel{position:absolute;top:0;left:0;right:0;height:46px;z-index:2;background:linear-gradient(#292929,#4b4b4b);display:flex;align-items:center;justify-content:center;color:#ddd;font:12px Arial,sans-serif}.adfox-close{position:absolute;right:9px;top:9px;width:28px;height:28px;border-radius:50%;background:#27272799;box-shadow:none;padding:0;display:grid;place-items:center;color:#ccc}.adfox-close:before,.adfox-close:after{content:"";position:absolute;width:18px;height:1px;background:currentColor;transform:rotate(45deg)}.adfox-close:after{transform:rotate(-45deg)}.adfox-close:hover{background:#161616;color:#fff}.adfox-close:focus-visible{outline:2px solid white;outline-offset:2px}.status{min-height:24px;font-size:13px;color:#63748a;margin-top:14px}iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:transparent}@media(max-width:800px){main{display:block;padding:22px 12px}header{max-width:390px;margin:0 auto 28px;padding-top:0}h1{font-size:32px}.phone{margin:auto;width:min(390px,100%)}.viewport{width:100%;height:auto;aspect-ratio:39/70}.label{margin:0 3px 10px}}</style></head><body><main><header><span class="tag">ВАРИАНТ ДЛЯ СОГЛАСОВАНИЯ</span><h1>Смешарики.<br>Живая афиша</h1><p>Отдельные герои и замедленный прыжок на афише. Текст остаётся неподвижным.</p><nav><a href="../">Текущий баннер</a><button id="replay">Повторить анимацию</button></nav><p class="status" id="preview-status" role="status">Показ баннера · автозакрытие через 15 секунд</p></header><section class="phone"><div class="label"><span>Мобильный fullscreen</span><span>390 × 700</span></div><div class="viewport"><div class="site"><div class="logo">myslo</div><h2>Хорошие новости<br>на каждый день</h2><div class="photo"></div><div class="lines"></div><h2>События города</h2><div class="lines"></div></div><div class="ad-layer" id="ad-layer"><iframe id="preview" src="./banner/index.html?v=4" title="Анимированный fullscreen Смешарики" allowtransparency="true"></iframe><div class="adfox-panel" aria-label="Панель управления баннером"><span id="countdown" aria-label="До закрытия баннера, секунд">15</span><button class="adfox-close" id="close-ad" type="button" aria-label="Закрыть баннер"></button></div></div></div></section></main><script>
(function(){
'use strict';
var frame=document.getElementById('preview'),layer=document.getElementById('ad-layer'),counter=document.getElementById('countdown'),status=document.getElementById('preview-status'),timer=0,deadline=0;
function closeBanner(manual){clearInterval(timer);timer=0;counter.textContent='0';layer.hidden=true;frame.src='about:blank';status.textContent=manual?'Баннер закрыт. Нажмите «Повторить анимацию», чтобы показать его снова.':'15 секунд истекли — баннер закрыт.';}
function update(){var seconds=Math.max(0,Math.ceil((deadline-Date.now())/1000));counter.textContent=String(seconds);if(seconds===0)closeBanner(false);}
function startTimer(){if(layer.hidden)return;clearInterval(timer);deadline=Date.now()+15000;counter.textContent='15';status.textContent='Показ баннера · автозакрытие через 15 секунд';timer=setInterval(update,100);}
frame.addEventListener('load',startTimer);
document.getElementById('close-ad').addEventListener('click',function(){closeBanner(true);});
document.getElementById('replay').addEventListener('click',function(){clearInterval(timer);layer.hidden=false;counter.textContent='15';status.textContent='Загрузка баннера…';frame.src='./banner/index.html?v=4&replay='+Date.now();});
// Cover a cached iframe that completed before this script was parsed.
try{if(frame.contentDocument&&frame.contentDocument.readyState==='complete'&&frame.contentDocument.querySelector('#ad'))startTimer();}catch(e){}
})();
</script></body></html>
