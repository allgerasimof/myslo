<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Смешарики — большое шоу</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font-family:Arial,Helvetica,sans-serif}#ad{position:absolute;inset:0;overflow:hidden;container-type:size;color:white;text-decoration:none;-webkit-tap-highlight-color:transparent}.veil{position:absolute;inset:0;background:rgba(255,255,255,.4);opacity:0;transition:opacity .16s}.started .veil{opacity:1}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.poster{position:absolute;inset:0;background:linear-gradient(90deg,#24dae8,#0faed8 25%,#0486d1 50%,#0057b6 75%,#013396);opacity:0;visibility:hidden;transition:opacity .16s}.revealing .poster,.finished .poster{opacity:1;visibility:visible}.finished canvas,.finished .veil{visibility:hidden}.artboard{position:absolute;left:50%;bottom:0;width:min(100cqw,calc((100cqh - 64px)*2/3));aspect-ratio:2/3;transform:translateX(-50%);container-type:size}.cast{position:absolute;inset:0}.hero{position:absolute;object-fit:contain;object-position:center bottom;will-change:transform;animation:slowJump 9s cubic-bezier(.36,0,.64,1) infinite;animation-play-state:paused}.hero-nyusha{left:10%;top:37%;width:51%;height:auto;animation-delay:-2s;z-index:1}.hero-kopatych{left:49%;top:35.5%;width:58%;height:auto;animation-delay:-6s;z-index:2}.hero-hedgehog{left:-3%;top:57%;width:56%;height:auto;animation-delay:-4s;z-index:3}.hero-krosh{left:23%;top:51%;width:84%;height:auto;animation-delay:0s;z-index:4}.revealing .hero,.finished .hero{animation-play-state:running}@keyframes slowJump{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-3cqw) rotate(1deg)}}@media(prefers-reduced-motion:reduce){.hero{animation:none}}.copy{position:absolute;top:calc((46px + 100cqh - min(95.1cqw,calc((100cqh - 64px)*.634)))/2);left:50%;width:min(90cqw,calc((100cqh - 64px)*.6));transform:translate(-50%,-50%);container-type:inline-size;text-align:center;text-shadow:0 3px 0 #003c8d,0 6px 22px #00347744}.eyebrow{font-size:3.4cqw;font-weight:800;letter-spacing:.1em;margin:0 0 2cqw}.title{margin:0;white-space:nowrap;font-weight:900;font-size:12.8cqw;line-height:.92;letter-spacing:-.065em;color:#fff}.title em{display:block;font-size:14.4cqw;letter-spacing:-.065em;color:#ffe55a;font-style:normal;transform:rotate(-3deg);padding-top:1.5cqw}.subtitle{font-size:4.2cqw;line-height:1.15;font-weight:700;margin:3cqw 0 0}.details{display:inline-block;background:#fff;color:#0751a9;border-radius:100px;padding:2cqw 4cqw;font-size:2.9cqw;font-weight:800;margin-top:2cqw;text-shadow:none}.age{position:absolute;bottom:1.6%;right:4%;font-size:3cqw;font-weight:bold;background:#fff;color:#0751a9;border-radius:50%;width:7cqw;height:7cqw;display:grid;place-items:center}@media(prefers-reduced-motion:reduce){.poster{transition:none}}
</style></head><body>
<a id="ad" href="%banner.reference_mrc_user1%" target="%banner.target%" rel="noopener" aria-label="Смешарики. Большое шоу для всей семьи">
<div class="veil"></div><canvas id="animation" aria-hidden="true"></canvas>
<section class="poster" aria-label="Афиша шоу"><div class="artboard"><div class="cast" aria-label="Крош, Ёжик, Нюша и Копатыч"><img class="hero hero-nyusha" src="assets/nyusha.png" alt="Нюша"><img class="hero hero-kopatych" src="assets/kopatych.png" alt="Копатыч"><img class="hero hero-hedgehog" src="assets/hedgehog.png" alt="Ёжик"><img class="hero hero-krosh" src="assets/krosh-hero.png" alt="Крош"></div><span class="age">0+</span></div><div class="copy">
<!-- Все тексты афиши редактируются здесь, независимо от изображения. -->
<p class="eyebrow">ТОЛЬКО С 1 ПО 30 ДЕКАБРЯ</p><h1 class="title">СМЕШАРИКИ<em>Большое шоу!</em></h1><p class="subtitle">Приключения начинаются<br>вместе с любимыми героями</p><p class="details">УЗНАТЬ ПОДРОБНЕЕ →</p>
</div></section></a>
<script nonce="%request.eid1%">
(function(){'use strict';
var ad=document.getElementById('ad'),canvas=document.getElementById('animation'),ctx=canvas.getContext('2d'),sprite=new Image(),poster=document.querySelector('.hero-krosh'),start=0,raf=0,w=0,h=0,reduced=matchMedia('(prefers-reduced-motion: reduce)'),duration=3460;
function resize(){w=ad.clientWidth;h=ad.clientHeight;var d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0)}
function lerp(a,b,t){return a+(b-a)*t}function clamp(t){return Math.max(0,Math.min(1,t))}function ease(t){return t*t*(3-2*t)}
// Motion in viewport units. Sprite changes only at the squash/look/jump poses.
function paint(ms){ctx.clearRect(0,0,w,h);var t=ms/1000,base=Math.min(w*.66,h*.38),x=w*.5,y=h*.57,scale=1,angle=0,frame=0;
if(t<.25)return;
if(t<.95){var p=clamp((t-.25)/.7);y=lerp(-base*.75,h*.57,p*p);angle=lerp(-.13,.06,p)}
else if(t<1.1){frame=1;scale=1+.08*Math.sin((t-.95)/.15*Math.PI)}
else if(t<1.55){var p=(t-1.1)/.45;y-=Math.sin(p*Math.PI)*h*.16;angle=-.09*Math.sin(p*Math.PI)}
else if(t<1.75){frame=1}
else if(t<2.12){frame=2;angle=-.045}
else if(t<2.5){frame=3;angle=.045}
else if(t<2.8){frame=4;y-=Math.sin((t-2.5)/.3*Math.PI)*h*.025}
else{frame=5;var p=clamp((t-2.8)/.66);scale=lerp(1,Math.max(w,h)/base*4.5,p*p*p);y=lerp(h*.57,h*.52,ease(p));angle=-.08*Math.sin(p*Math.PI)}
var cw=sprite.naturalWidth/3,ch=sprite.naturalHeight/2,size=base*scale;ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.drawImage(sprite,(frame%3)*cw,Math.floor(frame/3)*ch,cw,ch,-size/2,-size/2,size,size);ctx.restore();
}
function finish(){cancelAnimationFrame(raf);ad.classList.add('finished');document.documentElement.dataset.animation='finished'}
function tick(now){var elapsed=now-start;if(elapsed>=duration){finish();return}canvas.style.filter=elapsed>3090?'blur('+Math.min(18,(elapsed-3090)/18)+'px)':'none';if(elapsed>=3300)ad.classList.add('revealing');paint(elapsed);raf=requestAnimationFrame(tick)}
function run(){resize();ad.classList.add('started');if(!sprite.naturalWidth||reduced.matches){finish();return}start=performance.now();document.documentElement.dataset.animation='running';raf=requestAnimationFrame(tick)}
Promise.all([new Promise(function(resolve){sprite.onload=resolve;sprite.onerror=function(){finish();resolve()};sprite.src='assets/krosh.png'}),Promise.all(Array.from(document.querySelectorAll('.hero')).map(function(img){return img.decode().catch(function(){})}))]).then(run);
window.addEventListener('resize',resize);reduced.addEventListener('change',function(e){if(e.matches)finish()});
// No direct advertiser URL: navigation is supplied exclusively by Adfox.
ad.addEventListener('click',function(e){if(ad.getAttribute('href').indexOf('%')!==-1)e.preventDefault()});
})();
</script></body></html>
